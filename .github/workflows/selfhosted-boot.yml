name: Self-hosted boot

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: production
    permissions:
      contents: read
      packages: write

  boot:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag for compose
        run: |
          docker pull "${{ needs.build.outputs.image-ref }}"
          docker tag "${{ needs.build.outputs.image-ref }}" laauurraaa/scrybble-server:latest

      - name: Stage CI .env
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^APP_KEY=.*|APP_KEY=base64:Qf2LN6kbcZttv6a5RH+wX2mcd7QDE3Q6cn/pF6y3dzA=|' \
            -e 's|^APP_ENV=.*|APP_ENV=production|' \
            -e 's|^APP_DEBUG=.*|APP_DEBUG=false|' \
            .env

      - name: Boot the self-hosted stack and wait for healthchecks
        run: |
          docker compose \
            -f docker-compose.selfhosted.yml \
            -f docker-compose.selfhosted.ci.yml \
            up -d --wait --wait-timeout 300

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.selfhosted.yml \
            -f docker-compose.selfhosted.ci.yml \
            logs --no-color
