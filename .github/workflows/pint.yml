name: Code Quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: testing
    permissions:
      contents: read
      packages: write

  pint:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Pint (fail on unformatted code)
        run: |
          docker run --rm \
            ${{ needs.build.outputs.image-ref }} \
            vendor/bin/pint --test --verbose
