name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.1
        env:
          MYSQL_DATABASE: scrybble_test
          MYSQL_USER: scrybble_dev
          MYSQL_PASSWORD: scrybble_dev_pwd
          MYSQL_ROOT_PASSWORD: scrybble_dev_pwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pscrybble_dev_pwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build testing image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/App.Dockerfile
          target: testing
          tags: scrybble-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RELEASE_HASH=${{ github.sha }}

      - name: Run PHPUnit
        run: |
          docker run --rm \
            --network host \
            scrybble-test:latest \
            vendor/bin/phpunit
