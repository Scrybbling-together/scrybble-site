name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: testing
    permissions:
      contents: read
      packages: write

  paratest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    services:
      mysql:
        image: mysql:9.1
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: scrybble_dev
          MYSQL_PASSWORD: scrybble_dev_pwd
          MYSQL_ROOT_PASSWORD: scrybble_dev_pwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pscrybble_dev_pwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Paratest
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/.env.ci:/var/www/html/.env.testing" \
            ${{ needs.build.outputs.image-ref }} \
            php artisan test --parallel
