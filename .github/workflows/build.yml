name: Build & push to GHCR

on:
  workflow_call:
    inputs:
      target:
        description: 'Dockerfile target stage (testing | production)'
        required: true
        type: string
    outputs:
      image-ref:
        description: 'Fully qualified GHCR image reference for this commit'
        value: ${{ jobs.build.outputs.image-ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.ref.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image ref
        id: ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "value=ghcr.io/${owner}/scrybble-server:${{ inputs.target }}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/App.Dockerfile
          target: ${{ inputs.target }}
          tags: ${{ steps.ref.outputs.value }}
          push: true
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}
          build-args: |
            RELEASE_HASH=${{ github.sha }}