name: Publish to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.3). Also tagged :latest.'
        required: true
        type: string
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Resolve refs
        id: refs
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${{ inputs.version || github.event.release.tag_name }}"
          if [[ -z "$version" ]]; then
            echo "::error::No version supplied"; exit 1
          fi
          echo "source=ghcr.io/${owner}/scrybble-server:production-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-tag GHCR image onto Docker Hub
        run: |
          docker buildx imagetools create \
            --tag docker.io/laauurraaa/scrybble-server:${{ steps.refs.outputs.version }} \
            --tag docker.io/laauurraaa/scrybble-server:latest \
            ${{ steps.refs.outputs.source }}