services:
  app:
    image: "laauurraaa/scrybble-server:latest"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      # comment this out if you want to use letsencrypt.
      - "80:80"
    networks:
      - scrybble-network
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      remarks:
        condition: service_healthy
      # Uncomment if you want to use letsencrypt
      # nginx-proxy:
      #   condition: service_healthy
    expose:
      - "80"
    volumes:
      - app-cache:/var/www/html/storage/framework
      - ./efs/:/var/www/html/storage/efs/
      - ./.env:/var/www/html/.env
    environment:
      DB_CONNECTION: '${DB_CONNECTION}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_HOST: '${DB_HOST}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_PORT: '${DB_PORT}'
      DB_USERNAME: '${DB_USERNAME}'
      VIRTUAL_HOST: '${APP_URL}'
      VIRTUAL_PORT: '80'
      # Uncomment if you want to use letsencrypt
      # LETSENCRYPT_HOST: '${APP_URL}'
  db:
    image: mysql:9.1
    restart: always
    # uncomment to open up your database to external connections
    # ports:
    # - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./database/:/var/lib/mysql
    networks:
      - scrybble-network
  horizon:
    image: "laauurraaa/scrybble-server:latest"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    user: www-data
    restart:
      always
    networks:
      - scrybble-network
    command: ["php", "/var/www/html/artisan", "horizon"]
    volumes:
      - app-cache:/var/www/html/storage/framework
      - ./efs/:/var/www/html/storage/efs/
      - ./.env:/var/www/html/.env
    environment:
      PHP_FPM_POOL_NAME: "scrybble_horizon"
  # Uncomment if you want to use letsencrypt
#  nginx-proxy:
