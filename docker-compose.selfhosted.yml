  redis:
    restart: always
    image: 'redis:alpine'
    volumes:
      - 'app-redis:/data'
    networks:
      - scrybble-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      retries: 3
      timeout: 5s
  remarks:
    restart: always
    image: "laauurraaa/remarks-server:latest"
    networks:
      - scrybble-network
    volumes:
      - ./efs:/efs
networks:
  scrybble-network:
    driver: bridge
volumes:
  app-redis:
    driver: local
  app-cache:
    driver: local
  conf:
  vhost:
  html:
  certs:
  acme:
